name: Daily Investment Digest

on:
  schedule:
    # 12:30 UTC weekdays = 8:30am ET (EDT) / 7:30am ET (EST), before US open
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assistant-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python run_digest.py

      - name: Commit report
        run: |
          git config user.name "investment-assistant[bot]"
          git config user.email "actions@github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Daily digest $(date -u +%F) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
